name: CMake Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # You can change this to windows-latest or macos-latest if needed
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      # Creates the build directory and generates the build system files
      run: cmake -B ${{github.workspace}}/build

    - name: Build
      # Compiles the code using the generated build system
      run: cmake --build ${{github.workspace}}/build

    - name: Run Tests (Optional)
      # If your project uses CTest, uncomment these lines to run your tests
      # working-directory: ${{github.workspace}}/build
      # run: ctest --output-on-failure
