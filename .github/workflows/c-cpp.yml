name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAKE_DIR: '.'   # change to 'project' if Makefile is in a subfolder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug repo contents
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          echo "Find Makefile and package.json:"
          find . -maxdepth 4 -type f \( -iname 'Makefile' -o -iname 'package.json' \) -print || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Build with make
        run: |
          cd ${{ env.MAKE_DIR }}
          if [ -f Makefile ] || [ -f makefile ]; then
            make
          else
            echo "No Makefile found in ${{ env.MAKE_DIR }}. Aborting."
            exit 2
          fi
